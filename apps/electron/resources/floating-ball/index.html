<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  悬浮球页面。

  以前这段 HTML 是主进程里的一整个模板字符串，用 `data:text/html` 加载，并且
  窗口开着 `nodeIntegration: true` / `contextIsolation: false` / `sandbox: false`。
  改成独立文件 + 专用 preload 之后：
    - 页面不再 `require('electron')`，只通过 contextBridge 暴露的 4 个函数说话；
    - 走 file:// 而不是 data: URL，内容安全策略能正常生效（见下方 CSP）；
    - 窗口恢复三层隔离，任何注入都拿不到 Node。
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  #b {
    position: absolute; left: 6px; top: 6px; width: 52px; height: 52px; border-radius: 50%;
    cursor: pointer; background: #fff; box-shadow: 0 2px 10px rgba(0, 0, 0, .22);
    display: flex; align-items: center; justify-content: center; transition: transform .15s;
  }
  #b:hover { transform: scale(1.06); }
  #b img { width: 40px; height: 40px; border-radius: 50%; pointer-events: none; }
  #r { position: absolute; inset: -3px; border-radius: 50%; border: 3px solid transparent; pointer-events: none; }
  .running #r { border-top-color: #3b82f6; border-right-color: #3b82f6; animation: s 1s linear infinite; }
  .attention #r { border-color: #f59e0b; animation: p 1.2s ease-in-out infinite; }
  .done #r { border-color: #22c55e; animation: p .6s ease-in-out 3; }
  .error #r { border-color: #ef4444; }
  @keyframes s { to { transform: rotate(360deg); } }
  @keyframes p { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { #r { animation: none !important; } }
</style>
</head>
<body>
  <div id="b" title="Roy：单击打开，右键更多，拖动换位置"><img id="i" alt=""><div id="r"></div></div>
  <script>
    const api = window.royBall
    const b = document.getElementById('b')
    let down = null
    let moved = false

    b.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return
      down = { x: e.screenX, y: e.screenY }
      moved = false
    })
    window.addEventListener('mousemove', (e) => {
      if (!down) return
      const dx = e.screenX - down.x
      const dy = e.screenY - down.y
      if (!moved && Math.abs(dx) + Math.abs(dy) < 4) return
      moved = true
      api.drag(dx, dy)
      down = { x: e.screenX, y: e.screenY }
    })
    window.addEventListener('mouseup', (e) => {
      if (e.button !== 0 || !down) return
      down = null
      if (moved) api.dragEnd()
      else api.click()
    })
    b.addEventListener('contextmenu', (e) => {
      e.preventDefault()
      api.menu()
    })

    api.onState((state) => { document.body.className = state })
    api.onIcon((url) => { document.getElementById('i').src = url })
  </script>
</body>
</html>
