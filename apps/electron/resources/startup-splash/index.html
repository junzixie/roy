<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roy</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        /* 固定深色：青绿粒子的对比全靠暗底，启动页是品牌时刻，不跟主题走 */
        background: radial-gradient(120% 90% at 50% 42%, #0b1a1e 0%, #050b0e 52%, #020507 100%);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* 极细网格，给暗底一点层次，不抢主体 */
      .grid {
        position: fixed; inset: 0; opacity: .35; pointer-events: none; z-index: 0;
        background-image:
          linear-gradient(rgba(120,200,190,.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(120,200,190,.06) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 72%);
        -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 72%);
      }

      .stage {
        position: relative; z-index: 1; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      /* 视频模式：整屏视频上字直接压在图上，加投影、往下挪一点不挡主体 */
      body.mode-video .stage {
        padding-top: 22vh;
        text-shadow: 0 1px 12px rgba(0, 0, 0, .55), 0 1px 3px rgba(0, 0, 0, .4);
      }

      /* 粒子球（照 Arthur 的 JarvisHud）：Canvas 2D，不依赖任何素材 */
      #orbCanvas { display: block; filter: drop-shadow(0 0 40px rgba(64, 245, 214, .12)); }

      /* 视频宿主：整屏铺满 */
      .video-host { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
      .video-host video { width: 100%; height: 100%; object-fit: cover; display: block; }

      /* 字标：从模糊+拉宽显影到清晰+收紧 */
      .word {
        margin-top: 4px; display: flex; align-items: baseline;
        letter-spacing: .32em; animation: tracking 1.25s cubic-bezier(.22, 1, .36, 1) forwards;
      }
      @keyframes tracking { to { letter-spacing: .18em; } }
      .letter {
        display: inline-block; font-size: 18px; font-weight: 500; color: #dff3ee;
        opacity: 0; transform: translateY(6px); filter: blur(7px);
        animation: letter-in .85s cubic-bezier(.22, 1, .36, 1) forwards;
      }
      body.mode-video .letter { font-size: 22px; color: #fff; }
      @keyframes letter-in {
        60% { opacity: 1; }
        to { opacity: 1; transform: translateY(0); filter: blur(0); }
      }

      /* 进度线：一条暗轨道，上面的青绿段由**真实启动进度**驱动。
         .fill 的初始动画只是一段「蠕动」兜底：万一没收到任何进度事件（例如
         preload 没加载），它也会缓慢爬到 26% 停住，看起来在动而不是死钉在 0；
         真实进度一到就用内联 width 覆盖它（见下面的 applyProgress）。 */
      .track {
        margin-top: 20px; display: block; height: 1px; width: 168px;
        background: rgba(160, 220, 210, .14); overflow: hidden; border-radius: 999px;
      }
      .fill {
        display: block; height: 100%; width: 0; border-radius: 999px;
        background: linear-gradient(90deg, rgba(86,246,205,.25), rgba(86,246,205,.95));
        box-shadow: 0 0 8px rgba(86, 246, 205, .55);
        animation: creep 3.2s cubic-bezier(.3, 0, .2, 1) forwards;
      }
      @keyframes creep {
        0% { width: 0; }
        100% { width: 26%; }
      }

      /* 步骤文案：淡入、停留、淡出 */
      .step {
        margin-top: 16px; height: 18px; overflow: hidden; font-size: 12px; letter-spacing: .04em;
        color: rgba(150, 196, 188, .72);
      }
      .step span { display: block; animation: step-in 1.6s ease-in-out both; }
      @keyframes step-in {
        0% { opacity: 0; transform: translateY(4px); }
        22%, 78% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-4px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .letter, .step span, .word { animation-duration: .01s; }
        .fill { animation: none; width: 26%; }
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="video-host" id="videoHost" hidden></div>
    <main class="stage" aria-busy="true" aria-live="polite">
      <canvas id="orbCanvas" hidden aria-hidden="true"></canvas>
      <div class="word" id="word"></div>
      <span class="track" id="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="启动进度"><span class="fill"></span></span>
      <div class="step" id="step"></div>
    </main>

    <script>
      // ===== 字标 =====
      const WORD = 'Roy'.split('')
      const word = document.getElementById('word')
      WORD.forEach((ch, i) => {
        const el = document.createElement('span')
        el.className = 'letter'
        el.textContent = ch
        el.style.animationDelay = (820 + i * 50) + 'ms'
        word.appendChild(el)
      })

      // ===== 进度与步骤文案：由主进程推送真实状态 =====
      // 这里**不再**轮播写死的文案、也不再跑一条固定时长的假进度条。主进程在
      // safeRun / safeAwait 里上报每一步真实启动阶段（见 main/index.ts 的
      // reportBootProgress），preload 把它转成 { label, percent } 事件。
      const stepEl = document.getElementById('step')
      const fillEl = document.querySelector('.fill')
      const trackEl = document.getElementById('track')
      let splashStopped = false
      let orbFrame = 0

      /** 把一条真实进度画到界面上。 */
      const applyProgress = ({ label, percent }) => {
        if (splashStopped) return
        // 首次收到真实进度就接管进度条：关掉兜底的 creep 动画，改内联宽度。
        if (fillEl.style.animation !== 'none') {
          fillEl.style.animation = 'none'
          fillEl.style.transition = 'width .45s cubic-bezier(.3, 0, .2, 1)'
        }
        fillEl.style.width = Math.max(percent, 3) + '%'
        trackEl.setAttribute('aria-valuenow', String(percent))
        // 文案只在真的变了才重播动画，避免同一句话被反复重建而闪烁。
        if (stepEl.dataset.label === label) return
        stepEl.dataset.label = label
        stepEl.innerHTML = ''
        const s = document.createElement('span')
        s.textContent = label
        stepEl.appendChild(s)
      }

      // 兜底文案：先铺上，再订阅。反过来的话，若某条进度在订阅后、兜底前抵达，
      // 兜底会把刚写好的真实文案覆盖掉。
      stepEl.innerHTML = ''
      const initial = document.createElement('span')
      initial.textContent = '正在启动'
      stepEl.appendChild(initial)

      const splashApi = window.roySplash
      if (splashApi && typeof splashApi.onProgress === 'function') {
        splashApi.onProgress(applyProgress)
      }

      // 15 秒没有任何推进就明说「慢」，而不是让用户对着静止画面猜。
      const slowTimer = setTimeout(() => {
        if (splashStopped) return
        stepEl.innerHTML = ''
        const s = document.createElement('span')
        s.textContent = '启动比平时慢，仍在继续…'
        stepEl.appendChild(s)
      }, 15000)

      window.stopRoySplash = () => {
        splashStopped = true
        clearTimeout(slowTimer)
        cancelAnimationFrame(orbFrame)
        document.querySelectorAll('video').forEach(video => video.pause())
        document.getAnimations().forEach(animation => animation.pause())
      }
      window.addEventListener('pagehide', window.stopRoySplash, { once: true })
      // 点击跳过：用户不想等就立刻收起，不用等最短展示时长。
      document.addEventListener('click', () => {
        if (splashStopped) return
        if (splashApi && typeof splashApi.skip === 'function') splashApi.skip()
        else window.stopRoySplash()
      }, { once: true })

      // ===== 粒子球：照 Arthur 的 JarvisHud =====
      // 球面上几千个点绕轴自转，远处更暗更小、近处更亮更大；外圈一层稀疏星尘反向慢转。
      function mountOrb(cv) {
        cv.hidden = false
        const ctx = cv.getContext('2d')
        const CORE = [64, 245, 214]
        const FAR = [20, 120, 130]
        const dpr = Math.min(window.devicePixelRatio || 1, 2)
        let S = 0, C = 0, R = 0, pts = [], dust = []

        const orbSize = () => Math.round(Math.max(240, Math.min(window.innerWidth * 0.68, window.innerHeight * 0.66, 880)))

        function build() {
          S = orbSize(); C = S / 2; R = S * 0.4
          cv.width = Math.round(S * dpr); cv.height = Math.round(S * dpr)
          cv.style.width = S + 'px'; cv.style.height = S + 'px'
          const N = S < 340 ? 2600 : S < 500 ? 4200 : S < 700 ? 6000 : S < 860 ? 8200 : 9600
          const golden = Math.PI * (3 - Math.sqrt(5))
          pts = []
          for (let i = 0; i < N; i++) {
            const y = 1 - (i / (N - 1)) * 2
            const r = Math.sqrt(Math.max(0, 1 - y * y))
            const th = golden * i
            const j = 0.9 + Math.random() * 0.17
            pts.push({ x: Math.cos(th) * r * j, y: y * j, z: Math.sin(th) * r * j, s: 0.6 + Math.random() * 0.8, a: 0.5 + Math.random() * 0.5 })
          }
          dust = Array.from({ length: Math.round(N * 0.16) }, () => {
            const th = Math.random() * Math.PI * 2
            const ph = Math.acos(2 * Math.random() - 1)
            const rr = 1.14 + Math.random() * 0.56
            return { x: Math.cos(th) * Math.sin(ph) * rr, y: Math.cos(ph) * rr, z: Math.sin(th) * Math.sin(ph) * rr, s: 0.4 + Math.random() * 0.5, a: 0.25 + Math.random() * 0.4 }
          })
        }
        build()

        function draw(t) {
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
          ctx.clearRect(0, 0, S, S)

          const glow = ctx.createRadialGradient(C, C, 0, C, C, R * 1.5)
          glow.addColorStop(0, `rgba(${CORE},0.2)`)
          glow.addColorStop(0.45, `rgba(${CORE},0.06)`)
          glow.addColorStop(1, 'rgba(0,0,0,0)')
          ctx.fillStyle = glow
          ctx.beginPath(); ctx.arc(C, C, R * 1.5, 0, Math.PI * 2); ctx.fill()

          ctx.globalCompositeOperation = 'lighter'
          const core = ctx.createRadialGradient(C, C, 0, C, C, R * 0.62)
          core.addColorStop(0, `rgba(${CORE},0.26)`)
          core.addColorStop(0.45, `rgba(${CORE},0.07)`)
          core.addColorStop(1, 'rgba(0,0,0,0)')
          ctx.fillStyle = core
          ctx.beginPath(); ctx.arc(C, C, R * 0.62, 0, Math.PI * 2); ctx.fill()

          const spin = t * 0.16
          const tilt = (15 * Math.PI) / 180
          const cosT = Math.cos(tilt), sinT = Math.sin(tilt)
          const dotBase = Math.max(1, S / 340)

          const paint = (list, radius, rate, dim) => {
            const cs = Math.cos(spin * rate), sn = Math.sin(spin * rate)
            for (const p of list) {
              const x = p.x * cs - p.z * sn
              const z = p.x * sn + p.z * cs
              const y = p.y * cosT - z * sinT
              const z2 = p.y * sinT + z * cosT
              const depth = (z2 + 1) / 2
              const alpha = p.a * (0.42 + 0.58 * Math.pow(depth, 0.75)) * dim
              if (alpha < 0.02) continue
              const rr = dotBase * p.s * (0.7 + 0.5 * depth) * 1.28
              const a = Math.min(1, alpha)
              ctx.fillStyle = depth < 0.45 ? `rgba(${FAR},${a * 0.85})` : `rgba(190,255,246,${a})`
              ctx.fillRect(C + x * radius - rr / 2, C + y * radius - rr / 2, rr, rr)
            }
          }
          paint(dust, R * 1.02, -0.5, 0.55)
          paint(pts, R, 1, 1)

          ctx.globalCompositeOperation = 'source-over'
          ctx.strokeStyle = `rgba(${CORE},0.09)`
          ctx.lineWidth = Math.max(0.8, S / 320)
          ctx.beginPath(); ctx.arc(C, C, R * 1.005, 0, Math.PI * 2); ctx.stroke()
        }

        const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
        let last = 0
        const frame = (ms) => {
          if (splashStopped) return
          orbFrame = requestAnimationFrame(frame)
          if (document.hidden) return
          if (still && ms - last < 80) return
          last = ms
          draw(ms / 1000)
        }
        orbFrame = requestAnimationFrame(frame)

        let resizeTimer = 0
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer)
          resizeTimer = setTimeout(() => { if (orbSize() !== S) build() }, 120)
        })
      }

      // ===== 视频动画：整屏铺满循环播放（文件在启动页同级目录，不依赖网络） =====
      function mountVideo(host, src) {
        document.body.classList.add('mode-video')
        host.hidden = false
        const video = document.createElement('video')
        video.src = src
        video.muted = true
        video.loop = true
        video.autoplay = true
        video.playsInline = true
        video.preload = 'auto'
        host.appendChild(video)
        // 整屏视频太抢，压一层暗色，保证字标和步骤文案可读
        const scrim = document.createElement('div')
        scrim.style.cssText = 'position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 55% at 50% 58%, rgba(3,6,12,0.55) 0%, rgba(3,6,12,0.30) 60%, rgba(3,6,12,0.45) 100%)'
        host.appendChild(scrim)
        const play = () => { if (!splashStopped && !document.hidden) video.play().catch(() => {}) }
        video.addEventListener('canplay', play, { once: true })
        // 视频读不出来就退回粒子球，绝不留一块黑屏
        video.addEventListener('error', () => {
          host.hidden = true
          host.innerHTML = ''
          document.body.classList.remove('mode-video')
          mountOrb(document.getElementById('orbCanvas'))
        }, { once: true })
        play()
      }

      const ANIMATIONS = [
        { name: 'orb' },
        { name: 'fb-gateway', file: 'fb-gateway.mp4' },
        { name: 'fb-planet', file: 'fb-planet.mp4' },
        { name: 'fb-bolt', file: 'fb-bolt.mp4' },
        { name: 'fb-arches', file: 'fb-arches.mp4' },
        { name: 'fb-astronaut', file: 'fb-astronaut.mp4' },
        { name: 'fb-neon-helmet', file: 'fb-neon-helmet.mp4' },
        { name: 'fb-aurora', file: 'fb-aurora.mp4' },
        { name: 'fb-night', file: 'fb-night.mp4' },
        { name: 'anim-bg2', file: 'anim-bg2.mp4' },
        { name: 'anim-hf1', file: 'anim-hf1.mp4' },
      ]

      /**
       * ?anim= 决定用哪个：
       * - 缺省：粒子球
       * - 具体名字：固定用那一个
       * - random：从全部动画里随机
       */
      function resolveAnimation() {
        // 已删除的重复动画映射到保留的同款（与 StartupAnimationSetting.tsx 同步）
        const LEGACY = { 'anim-neon': 'fb-neon-helmet', 'anim-hf2': 'fb-planet' }
        const raw = new URLSearchParams(location.search).get('anim')
        const wanted = (raw && LEGACY[raw]) || raw
        if (!wanted) return ANIMATIONS[0]
        if (wanted === 'random') return ANIMATIONS[Math.floor(Math.random() * ANIMATIONS.length)]
        return ANIMATIONS.find((a) => a.name === wanted) || ANIMATIONS[0]
      }

      const chosen = resolveAnimation()
      if (chosen.file) mountVideo(document.getElementById('videoHost'), chosen.file)
      else mountOrb(document.getElementById('orbCanvas'))
    </script>
  </body>
</html>
